spec:
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        tier: db-f1-micro
        name: spesidaler
        databases:
          - name: spesidaler
            envVarPrefix: DATABASE
            users:
              - name: "spesidaler-opprydding-dev"
        flags:
          - name: cloudsql.enable_pgaudit
            value: "off"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  azure:
    application:
      tenant: trygdeetaten.no
  ingresses:
    - "https://spesidaler.ansatt.dev.nav.no"
    - "https://spesidaler.intern.dev.nav.no"
