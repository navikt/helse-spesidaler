apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: spesidaler-api
  namespace: tbd
  labels:
    team: tbd
spec:
  strategy:
    type: RollingUpdate
  replicas:
    min: 2
    max: 12
  liveness:
    path: /isalive
  readiness:
    path: /isready
    periodSeconds: 1
  preStopHook:
    http:
      path: /stop
  resources:
    limits:
      memory: 1024Mi
  prometheus:
    path: /metrics
    enabled: true
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
    logging:
      destinations:
        - id: elastic
        - id: loki
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: spesidaler-async
          permissions:
            roles:
              - "inntekter-for-beregning"
              - "inntektsendringer"
    outbound:
      rules:
        - application: logging
          namespace: nais-system
